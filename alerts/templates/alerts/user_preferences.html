{% extends "base.html" %}

{% block content %}
  <h2>Update Your Preferences</h2>
  <form method="POST">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="button" id="select-all" class="btn btn-secondary">Select All</button>
    <button type="button" id="deselect-all" class="btn btn-secondary">Deselect All</button>
    <button type="submit" class="btn btn-primary">Save</button>
</form>

<!-- Select2 JS & CSS -->
<!-- <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script> -->

<script>
  $(document).ready(function() {
      // Initialize Select2 for alert_types field
      $('.select2').select2();

      // Implement Select All / Deselect All functionality
      $('#select-all').on('click', function() {
          $('.select2').val($('.select2 option').map(function() {
              return $(this).val();
          }).get()).trigger('change');
      });

      $('#deselect-all').on('click', function() {
          $('.select2').val([]).trigger('change');
      });
  });
</script>
{% endblock %}
